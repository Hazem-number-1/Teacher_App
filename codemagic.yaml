workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Clean and get packages
        script: |
          flutter clean
          flutter pub get
      - name: Build APK Release
        script: flutter build apk --release --no-pub
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
