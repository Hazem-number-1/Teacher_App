workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Upgrade Android Embedding & Build APK
        script: |
          flutter create --org com.example.teacherapp . --platforms=android
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
